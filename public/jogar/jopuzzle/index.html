<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0D1C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>JoPuzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2026.11.01.1">
</head>
<body>
<main id="app">
  <div class="modebar">
    <div class="modes" role="group" aria-label="Modo de jogo">
      <button id="mode-easy" class="mode on" aria-label="Fácil, 3 peças" aria-pressed="true">
        <svg viewBox="0 0 22 22" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="2"/><rect x="12" y="2" width="8" height="8" rx="2"/><rect x="2" y="12" width="8" height="8" rx="2"/><rect class="ghost" x="12" y="12" width="8" height="8" rx="2"/></svg>
        <span>3</span>
      </button>
      <button id="mode-hard" class="mode" aria-label="Difícil, 4 peças" aria-pressed="false">
        <svg viewBox="0 0 22 22" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="2"/><rect x="12" y="2" width="8" height="8" rx="2"/><rect x="2" y="12" width="8" height="8" rx="2"/><rect x="12" y="12" width="8" height="8" rx="2"/></svg>
        <span>4</span>
      </button>
      <button id="mode-super" class="mode hot" aria-label="Super difícil, 6 peças" aria-pressed="false">
        <svg viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="4" width="6" height="6" rx="1.6"/><rect x="8" y="4" width="6" height="6" rx="1.6"/><rect x="15" y="4" width="6" height="6" rx="1.6"/><rect x="1" y="12" width="6" height="6" rx="1.6"/><rect x="8" y="12" width="6" height="6" rx="1.6"/><rect x="15" y="12" width="6" height="6" rx="1.6"/></svg>
        <span>6</span>
      </button>
    </div>
    <div id="level" class="chip" aria-label="Fase">01</div>
  </div>

  <header class="top">
    <button id="btn-pause" class="icon-btn" aria-label="Pausar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>
    </button>
    <div class="timer">
      <div class="timer-row">
        <span id="time" class="time">45</span>
        <div id="stars" class="stars" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
          <svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
          <svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
        </div>
      </div>
      <div class="bar"><div id="bar-fill" class="bar-fill"></div><i id="tick-3" class="tick"></i><i id="tick-2" class="tick"></i></div>
    </div>
    <button id="btn-skip" class="icon-btn warn" aria-label="Desistir e ir para o próximo puzzle">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M6 5l9 7-9 7z"/><path d="M19 5v14"/></svg>
    </button>
  </header>

  <section id="board-area" class="board-area">
    <div class="board-frame">
      <div id="board" class="board">
        <div id="holes"></div>
        <div id="board-pieces"></div>
      </div>
    </div>
  </section>

  <section class="tray-panel">
    <div id="tray" class="tray"></div>
    <div class="legend" role="note" aria-label="Um toque na peça gira. Segurar o dedo na peça espelha.">
      <span class="lg"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg><i class="dot"></i></span>
      <span class="lg"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18"/><path d="M8 7L3 17h5z"/><path d="M16 7l5 10h-5z"/></svg><i class="hold"></i></span>
    </div>
  </section>
</main>

<div id="drag-layer" class="drag-layer"></div>

<div id="overlay" class="overlay" data-kind="start">
  <div id="version" class="version" aria-label="Versão do jogo"></div>
  <div class="ov ov-play">
    <button id="btn-play" class="big-btn" aria-label="Jogar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button id="btn-skip2" class="icon-btn warn skip2" aria-label="Desistir e ir para o próximo puzzle">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M6 5l9 7-9 7z"/><path d="M19 5v14"/></svg>
    </button>
  </div>
  <div class="ov ov-end">
    <div id="end-stars" class="end-stars" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
    </div>
    <div class="end-time">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/></svg>
      <span id="end-time">0</span>
    </div>
    <button id="btn-next" class="big-btn" aria-label="Próximo puzzle">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
    </button>
  </div>
</div>

<script src="puzzles.js?v=2026.11.01.1"></script>
<script src="game.js?v=2026.11.01.1"></script>
</body>
</html>
